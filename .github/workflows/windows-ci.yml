name: Windows build and tests

on:
  push:
    branches:
      - fix/thumbnails-fullscreen-restore
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore MoveWindowEverywhere.sln
      - name: Build
        run: dotnet build MoveWindowEverywhere.sln -c Release --no-restore
      - name: Test
        run: dotnet test MoveWindowEverywhere.sln -c Release --no-build --no-restore
